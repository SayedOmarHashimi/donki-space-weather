name: Refresh space weather data

on:
  schedule:
    - cron: "0 6 * * *"     # daily at 06:00 UTC
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write             # lets the job commit refreshed JSON back to the repo

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist the DuckDB warehouse across runs so history accumulates.
      # Unique key each run -> always saves; restore-keys pulls the latest.
      - name: Restore warehouse (DuckDB) cache
        uses: actions/cache@v4
        with:
          path: warehouse/space_data.duckdb
          key: duckdb-warehouse-${{ github.run_id }}
          restore-keys: |
            duckdb-warehouse-

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          dbt_project:
            target: prod
            outputs:
              prod:
                type: duckdb
                path: ${GITHUB_WORKSPACE}/warehouse/space_data.duckdb
                threads: 4
          EOF

      - name: Extract DONKI data
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          mkdir -p warehouse
          python extraction/donki_flr.py
          python extraction/donki_cme.py
          python extraction/donki_gst.py

      - name: Build models (dbt)
        working-directory: dbt_project
        run: dbt run

      - name: Export JSON for the dashboard
        run: python exports/export_json.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh space weather data"
            git push
          fi
